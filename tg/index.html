<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Hisobot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eef1fa;--card:#fff;--card2:#f4f6fd;--tx:#121835;--mu:#68739b;--bd:#e0e5f5;--ac:#0fb5a3;--ac2:#6366f1;--cur:#0fb5a3;--prev:#a3acd0;--up:#0f9d63;--dn:#e0434d;--upbg:#dcf5ea;--dnbg:#fde3e5;--sh:rgba(40,52,110,.13);--hi:rgba(255,255,255,.9);--glow:rgba(15,181,163,.28)}
html.dark{--bg:#0a0f24;--card:#131a3b;--card2:#192250;--tx:#eef2ff;--mu:#93a0d0;--bd:#26316b;--ac:#2dd4bf;--ac2:#818cf8;--cur:#2dd4bf;--prev:#5d6aa3;--up:#4ade80;--dn:#ff7b86;--upbg:#14402f;--dnbg:#4a1f2b;--sh:rgba(0,0,0,.5);--hi:rgba(255,255,255,.07);--glow:rgba(45,212,191,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70vmax 50vmax at 0% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 62%),radial-gradient(60vmax 45vmax at 105% 5%,color-mix(in srgb,var(--ac2) 16%,transparent),transparent 62%)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 8px}
h1{font-size:24px;margin:0;letter-spacing:-.4px}
.sub{color:var(--mu);font-size:12.5px;margin-top:1px}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid var(--bd);background:linear-gradient(180deg,color-mix(in srgb,#fff 8%,var(--card)),var(--card));color:var(--tx);display:grid;place-items:center;font-size:18px;box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--bd),0 8px 14px -8px var(--sh);cursor:pointer;transition:transform .12s}
.ib:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 8px 14px -10px var(--sh)}
.ib.spin span{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 10px}
.cmp .vs{color:var(--mu);font-size:12px;font-weight:600}
.sel{position:relative}
.sel select{width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--bd);background:linear-gradient(180deg,color-mix(in srgb,#fff 6%,var(--card)),var(--card));color:var(--tx);font:inherit;font-weight:650;padding:11px 30px 11px 14px;border-radius:14px;box-shadow:inset 0 1px 0 var(--hi),0 8px 16px -10px var(--sh)}
.sel.a select{border-color:color-mix(in srgb,var(--cur) 55%,var(--bd))}
.sel::after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.sel i{position:absolute;left:-1px;top:50%;width:4px;height:18px;margin-top:-9px;border-radius:3px;background:var(--cur)}
.sel.b i{background:var(--prev)}
.sticky{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -14px;padding:2px 14px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;box-shadow:0 6px 12px -9px var(--sh);transition:all .15s}
.chip.on{color:#04211d;border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,#fff 35%,var(--ac)),var(--ac));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -6px var(--glow)}
.seg{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px;border:1px solid var(--bd)}
.seg button{border:0;background:transparent;color:var(--mu);font:inherit;font-weight:650;font-size:13px;padding:6px 13px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 3px 8px -3px var(--sh)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:linear-gradient(165deg,color-mix(in srgb,#fff 5%,var(--card)),var(--card) 60%);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-top:12px;box-shadow:inset 0 1px 0 var(--hi),0 14px 28px -16px var(--sh)}
.card h2{font-size:15px;margin:0 0 12px;letter-spacing:-.1px}
.card h2 small{color:var(--mu);font-weight:500;font-size:12px;margin-left:6px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,var(--card)),color-mix(in srgb,var(--ac2) 18%,var(--card)));}
.hero p{margin:0;font-size:14.5px;line-height:1.5}
.hero b{font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:12px 13px;box-shadow:inset 0 1px 0 var(--hi),0 10px 18px -14px var(--sh)}
.kpi .l{color:var(--mu);font-size:12px;font-weight:600}
.kpi .v{font-size:26px;font-weight:750;letter-spacing:-.8px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.kpi .p{color:var(--mu);font-size:11.5px;margin-top:4px}
.dl{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.dl.up{color:var(--up);background:var(--upbg)}.dl.dn{color:var(--dn);background:var(--dnbg)}.dl.flat{color:var(--mu);background:var(--card)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
.ro{min-height:18px;font-size:12.5px;color:var(--mu);margin-bottom:2px}
.ro b{color:var(--tx)}
.st{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:11px 2px;border-top:1px solid var(--bd);cursor:pointer}
.st:first-of-type{border-top:0;padding-top:2px}
.st .n{font-weight:650}
.bars{margin-top:7px;display:grid;gap:4px}
.bar{height:7px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.bar.c i{background:linear-gradient(90deg,var(--cur),color-mix(in srgb,#fff 25%,var(--cur)))}
.bar.p i{background:var(--prev);opacity:.7}
.mu{color:var(--mu)}
.tp{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--bd)}
.tp:first-of-type{border-top:0;padding-top:0}
.rk{width:22px;color:var(--mu);font-weight:700;font-size:13px;padding-top:2px}
.ph{flex:none;width:54px;height:54px;border-radius:13px;background:var(--card2) center/cover no-repeat;border:1px solid var(--bd);box-shadow:0 8px 14px -8px var(--sh);display:grid;place-items:center;color:var(--mu);font-size:20px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tp .b{flex:1;min-width:0}
.tp .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .q{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.cc{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.cc span{font-size:11.5px;color:var(--mu);background:var(--card2);border:1px solid var(--bd);border-radius:999px;padding:1px 8px}
.cc span b{color:var(--tx);font-weight:650}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mv h3{font-size:12.5px;margin:0 0 6px;color:var(--mu);font-weight:650}
.mv .it{font-size:13px;padding:6px 0;border-top:1px solid var(--bd)}
.mv .it:first-of-type{border-top:0}
.mv .it .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.note{color:var(--mu);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.5}
.sk{border-radius:16px;background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:200% 100%;animation:shm 1.4s linear infinite;height:96px;margin-top:12px;border:1px solid var(--bd)}
@keyframes shm{to{background-position:-200% 0}}
.msg{text-align:center;padding:26px 18px}
.msg .big{font-size:34px}
.msg p{color:var(--mu);margin:8px 0 0}
.dots::after{content:"";animation:dt 1.4s steps(4,end) infinite}
@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade,.sk,.ib.spin span{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Hisobot</h1><div class="sub" id="sub">Kunlik, haftalik va oylik hisobot</div></div>
    <button class="ib" id="rf" title="Yangilash" aria-label="Yangilash"><span>⟳</span></button>
  </header>
  <div class="sticky">
    <div class="seg" id="kindSeg" style="display:flex;margin:2px 0 8px"><button data-kd="day" style="flex:1">Kunlik</button><button data-kd="week" style="flex:1">Haftalik</button><button data-kd="month" style="flex:1">Oylik</button></div>
    <div class="cmp" style="display:block">
      <div class="sel a" style="width:100%"><i></i><select id="selA" aria-label="Davr" style="width:100%"></select></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <main id="main"></main>
</div>
<script>
(function(){
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;
const demo=/[?&]demo\b/.test(location.search);
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,'\u202f');
const STORES=[['all','Hammasi'],['a','Amani'],['w','Warda'],['f','Afiya noor'],['w2','Warda 2']];
const S={kind:'day',opts:{day:[],week:[],month:[]},defs:{},key:'',saved:{},data:{},scope:'all',metric:'s',status:'init',err:'',poll:0};
if(tg){try{tg.ready();tg.expand();if(tg.colorScheme==='dark')document.documentElement.classList.add('dark');
  const hc=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();tg.setHeaderColor&&tg.setHeaderColor(tg.colorScheme==='dark'?'#0a0f24':'#eef1fa');tg.setBackgroundColor&&tg.setBackgroundColor(tg.colorScheme==='dark'?'#0a0f24':'#eef1fa');}catch(e){}}
else if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark');
if(/[?&]dark\b/.test(location.search))document.documentElement.classList.add('dark');
const tap=()=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged()}catch(e){}};

/* ---------- data ---------- */
async function api(keys,refresh){
  if(demo)return demoApi(keys);
  const r=await fetch('/.netlify/functions/tg-dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',months:keys,refresh:!!refresh})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||('Xato '+r.status)),{code:r.status});
  return j;
}
const defKey=k=>k==='day'?S.defs.d:k==='week'?S.defs.wa:S.defs.a;
async function load(refresh){
  clearTimeout(S.poll);
  try{
    if(!demo&&!(tg&&tg.initData)){S.status='out';return render()}
    if(!S.opts.month.length){const j=await api([]);S.opts={day:j.dayOptions||[],week:j.weekOptions||[],month:j.options||[]};S.defs=j.defaults;S.key=S.key||defKey(S.kind);fillSel()}
    const j=await api([S.key],refresh);
    Object.assign(S.data,j.months||{});
    S.status=j.status;S.err=j.error||'';
    if(!S.t0)S.t0=Date.now();if(j.status==='ready'||j.status==='build_error')S.t0=0;
    render();
    if(j.status!=='ready'&&j.status!=='build_error')S.poll=setTimeout(()=>load(false),6000);
    else $('#rf').classList.remove('spin');
  }catch(e){S.status='error';S.err=e.message||String(e);S.code=e.code;render();$('#rf').classList.remove('spin')}
}
function fillSel(){const list=S.opts[S.kind]||[];$('#selA').innerHTML=list.map(o=>`<option value="${o.key}">${esc(o.label)}</option>`).join('');$('#selA').value=S.key}

/* ---------- helpers ---------- */
const sc=p=>S.scope==='all'?p.all:(p.stores.find(x=>x.key===S.scope)||p.all);
const days=p=>Math.max(1,p.meta.days);
function dayLabel(p,i){const d=new Date(Date.UTC(+p.meta.from.slice(0,4),+p.meta.from.slice(5,7)-1,+p.meta.from.slice(8,10)+i));return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')}

/* ---------- sections ---------- */
function kpis(p){
  const x=sc(p),n=days(p),per=n>1?v=>`<div class="p">kuniga ${fmt(v/n)}</div>`:()=>'';
  const items=[['Sotildi',x.sold],['Kirim',x.imp],['Sof savdo',x.net],['Qaytarildi',x.ret],['Hisobdan chiqarildi',x.off]];
  let h=items.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${fmt(v)}</div>${per(v)}</div>`).join('');
  h+=`<div class="kpi"><div class="l">Sotuv / kirim</div><div class="v">${x.imp?Math.round(x.sold/x.imp*100):0}%</div></div>`;
  return `<section class="card fade"><h2>${esc(p.meta.label)}<small>${n} kun${p.meta.partial?' · hali tugamagan':''}</small></h2><div class="kpis">${h}</div></section>`;
}
function chart(p){
  if(p.meta.fullDays<2)return '';
  const k=S.metric,n=p.meta.fullDays,A=sc(p).daily[k].slice(0,p.meta.partial?p.meta.days:undefined);
  const W=340,H=172,pl=30,pr=8,pt=10,pb=22,mx=Math.max(1,...A);
  const nice=(()=>{const q=Math.pow(10,Math.floor(Math.log10(mx)));const f=mx/q;return (f<=1?1:f<=2?2:f<=5?5:10)*q})();
  const x=i=>pl+(W-pl-pr)*(n>1?i/(n-1):0),y=v=>pt+(H-pt-pb)*(1-v/nice);
  const path=A.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let g='';for(let i=0;i<=4;i++){const v=nice*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--bd)" stroke-width="1"/><text x="${pl-5}" y="${yy+3.5}" font-size="9.5" text-anchor="end" fill="var(--mu)">${fmt(v)}</text>`}
  let xl='';(n<=8?Array.from({length:n},(_,i)=>i):[0,4,9,14,19,24,29].filter(i=>i<n)).forEach(i=>{xl+=`<text x="${x(i)}" y="${H-6}" font-size="9.5" text-anchor="middle" fill="var(--mu)">${n<=8?dayLabel(p,i):i+1}</text>`});
  const area=A.length?`<path d="${path} L${x(A.length-1).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#ga)"/>`:'';
  return `<section class="card fade"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Kunlik dinamika</h2><div class="seg" id="metSeg"><button data-k="s" class="${k==='s'?'on':''}">Sotuv</button><button data-k="i" class="${k==='i'?'on':''}">Kirim</button></div></div>
  <div class="ro" id="ro">Grafikka tegib ko‘ring</div>
  <svg id="ch" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cur)" stop-opacity=".35"/><stop offset="1" stop-color="var(--cur)" stop-opacity="0"/></linearGradient></defs>${g}${xl}${area}<path d="${path}" fill="none" stroke="var(--cur)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line id="cl" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--mu)" stroke-width="1" opacity="0"/></svg></section>`;
}
function bindChart(p){
  const svg=$('#ch');if(!svg)return;const k=S.metric,A=sc(p).daily[k],W=340,pl=30,pr=8,n=p.meta.fullDays;
  const move=e=>{const r=svg.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;let i=Math.round(((cx/r.width*W)-pl)/(W-pl-pr)*(n-1));i=Math.max(0,Math.min(n-1,i));
    const xx=pl+(W-pl-pr)*(n>1?i/(n-1):0),cl=$('#cl');cl.setAttribute('x1',xx);cl.setAttribute('x2',xx);cl.setAttribute('opacity',.5);
    const ok=i<p.meta.days||!p.meta.partial;$('#ro').innerHTML=`<b>${dayLabel(p,i)}:</b> <b>${ok?fmt(A[i]||0):'—'}</b> dona`};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('touchmove',move,{passive:true});
}
function stores(p){
  if(S.scope!=='all'){
    const tot=p.all.sold,me=sc(p).sold;return `<section class="card fade"><h2>Umumiy savdodagi ulushi</h2><div class="row"><div style="font-size:26px;font-weight:750">${tot?Math.round(me/tot*100):0}%</div><div class="mu" style="text-align:right">${fmt(me)} / ${fmt(tot)} dona</div></div><div class="bars"><div class="bar c"><i style="width:${tot?me/tot*100:0}%"></i></div></div></section>`}
  const mx=Math.max(1,...p.stores.map(st=>st.sold));
  return `<section class="card fade"><h2>Do‘konlar bo‘yicha<small>sotuv · tegib tanlang</small></h2>${p.stores.map(st=>`<button class="st" data-s="${st.key}"><div class="row"><span class="n">${esc(st.name)}</span><span><b>${fmt(st.sold)}</b></span></div><div class="bars"><div class="bar c"><i style="width:${st.sold/mx*100}%"></i></div></div><div class="row mu" style="font-size:11.5px;margin-top:6px"><span>Qaytarildi: ${fmt(st.ret)}</span><span>Kirim: ${fmt(st.imp)}</span></div></button>`).join('')}</section>`;
}
function prodChips(c){return (c&&c.length)?`<div class="cc">${c.slice(0,5).map(([n,q])=>`<span>${esc(n||'rangsiz')} <b>${fmt(q)}</b></span>`).join('')}</div>`:''}
function top10(p){
  const list=sc(p).top.slice(0,10);
  if(!list.length)return `<section class="card fade"><h2>Top 10 mahsulot</h2><p class="mu">Bu davrda savdo yo‘q.</p></section>`;
  return `<section class="card fade"><h2>Top 10 mahsulot</h2>${list.map((x,i)=>`<div class="tp"><div class="rk">${i+1}</div><div class="ph">${x.p?`<img loading="lazy" src="${esc(x.p)}" alt="" onerror="this.remove()">`:'🛍️'}</div><div class="b"><div class="row"><div class="nm">${esc(x.n)}</div><div class="q">${fmt(x.s)}</div></div>${prodChips(x.c)}</div></div>`).join('')}</section>`;
}
function colors(p){
  const ca=sc(p).colors||[];if(!ca.length)return '';
  const mx=Math.max(1,...ca.map(c=>c[1]));
  return `<section class="card fade"><h2>Eng ko‘p sotilgan ranglar</h2>${ca.slice(0,6).map(([n,q])=>`<div class="cl"><span style="font-weight:600">${esc(n||'rangsiz')}</span><div class="bar c"><i style="width:${q/mx*100}%"></i></div><span style="text-align:right"><b>${fmt(q)}</b></span></div>`).join('')}</section>`;
}

/* ---------- render ---------- */
function kindHtml(){document.querySelectorAll('#kindSeg button').forEach(b=>b.classList.toggle('on',b.dataset.kd===S.kind))}
function setKind(k){if(k===S.kind)return;S.saved[S.kind]=S.key;S.kind=k;S.key=S.saved[k]||defKey(k);fillSel();S.status='building';render();load(false)}
function chipsHtml(){kindHtml();$('#chips').innerHTML=STORES.map(([k,n])=>`<button class="chip ${S.scope===k?'on':''}" data-s="${k}">${n}</button>`).join('')}
function render(){
  const m=$('#main');chipsHtml();
  $('#sub').textContent=S.status==='building'?'Ma’lumotlar tayyorlanmoqda':'Kunlik, haftalik va oylik hisobot';
  if(S.status==='out'){m.innerHTML=`<section class="card msg"><div class="big">📲</div><h2 style="margin-top:6px">Telegram ichida oching</h2><p>Bu sahifa faqat Telegram bot ichida ishlaydi. Botni oching va <b>Dashboard</b> tugmasini bosing.</p></section>`;return}
  if(S.status==='error'){m.innerHTML=`<section class="card msg"><div class="big">${S.code===403?'🔒':'⚠️'}</div><h2 style="margin-top:6px">${S.code===403?'Ruxsat yo‘q':'Xatolik'}</h2><p>${esc(S.err)}</p></section>`;return}
  if(S.status==='build_error'&&!S.data[S.key]){m.innerHTML=`<section class="card msg"><div class="big">⚠️</div><h2 style="margin-top:6px">Ma’lumotni tayyorlab bo‘lmadi</h2><p>${esc(S.err)}</p><p class="mu" style="margin-top:8px">Yuqoridagi ⟳ tugmasi bilan qayta urinib ko‘ring.</p></section>`;$('#rf').classList.remove('spin');return}
  const p=S.data[S.key];
  if(!p){
    m.innerHTML=`<section class="card msg fade"><div class="big">⏳</div><h2 style="margin-top:6px">Ma’lumotlar BILLZ dan olinmoqda<span class="dots"></span></h2><p>Bu davr birinchi marta ochilmoqda, shuning uchun BILLZ dan olinadi (kun — tez, oy — uzoqroq). Keyingi safar tayyor bo‘ladi. Sahifani yopsangiz ham bo‘ladi.</p>${S.t0&&Date.now()-S.t0>6*60*1000?'<p class="mu" style="margin-top:8px">Odatdagidan uzoq davom etmoqda. ⟳ tugmasini bosing; yordam bermasa, administratorga xabar bering.</p>':''}</section><div class="sk"></div><div class="sk"></div>`;
    $('#rf').classList.add('spin');return}
  let t='';try{t=new Date(p.meta.built).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){}
  m.innerHTML=kpis(p)+chart(p)+stores(p)+top10(p)+colors(p)+`<div class="note">Manba: BILLZ · yangilangan ${esc(t)}</div>`;
  if(S.status==='updating')$('#sub').textContent='Yangilanmoqda…';
  bindChart(p);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const kd=e.target.closest('#kindSeg [data-kd]');if(kd){tap();setKind(kd.dataset.kd);return}
  const c=e.target.closest('[data-s]');if(c){S.scope=c.dataset.s;tap();render();window.scrollTo({top:0,behavior:'smooth'});return}
  const k=e.target.closest('#metSeg [data-k]');if(k){S.metric=k.dataset.k;tap();render();return}
});
$('#selA').addEventListener('change',e=>{S.key=e.target.value;tap();S.status='building';render();load(false)});
$('#rf').addEventListener('click',()=>{tap();$('#rf').classList.add('spin');load(true)});

/* ---------- demo data (open /tg/?demo=1 in any browser to preview the design) ---------- */
function demoPeriod(key){
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const kind=key[0]==='d'?'day':key[0]==='w'?'week':'month',full=kind==='day'?1:kind==='week'?7:30;
  const names=['Rubashka lolali','Ko‘ylak “Aliya”','Palto klassik','Jinsi shim slim','Sumka mini','Kofta triko','Yubka plisse','Kurtka bomber','Futbolka basic','Ko‘ylak gulli'];
  const cols=['qora','oq','binafsha','bordo','ko‘k','qizil'];const shares={a:.34,w:.38,f:.1,w2:.18};
  const mk=sh=>{const tot=Math.round({day:130,week:900,month:3800}[kind]*sh);const top=names.map((n,i)=>({n,s:Math.max(1,Math.round(tot*(.12-.008*i))),rt:0,p:'',c:[[cols[i%6],Math.max(1,Math.round(tot*.04))]]}));
    const daily=b=>Array.from({length:full},()=>Math.round(b/full*(.6+rnd()*.8)));const imp=Math.round(tot*.8);
    return {sold:tot,ret:Math.round(tot*.04),net:Math.round(tot*.96),imp,off:Math.round(tot*.03),colors:cols.map((c,i)=>[c,Math.round(tot*(.2-.03*i))]),top,daily:{s:daily(tot),i:daily(imp)}}};
  const st=[['a','Amani'],['w','Warda'],['f','Afiya noor'],['w2','Warda 2']].map(([k,n])=>({key:k,name:n,...mk(shares[k])}));
  const sum=f=>st.reduce((a,x)=>a+x[f],0),ser=f=>Array.from({length:full},(_,i)=>st.reduce((a,x)=>a+x.daily[f][i],0));
  const to=key.slice(2)||'2026-11-04';const lab=kind==='day'?'Bugun (04.11.2026)':kind==='week'?'Oxirgi 7 kun (29.10–04.11)':'Noyabr 2026';
  return {meta:{month:key,kind,label:lab,short:lab,from:kind==='month'?'2026-11-01':kind==='week'?'2026-10-29':'2026-11-04',to:'2026-11-04',days:full,fullDays:full,partial:false,built:new Date().toISOString()},
    all:{sold:sum('sold'),ret:sum('ret'),net:sum('net'),imp:sum('imp'),off:sum('off'),colors:st[1].colors,top:st[1].top.map(x=>({...x,s:x.s*2})),daily:{s:ser('s'),i:ser('i')}},stores:st};
}
function demoApi(keys){
  const out={};keys.forEach(k=>out[k]=demoPeriod(k));
  return new Promise(ok=>setTimeout(()=>ok({status:'ready',options:[{key:'2026-11',label:'Noyabr 2026'},{key:'2026-10',label:'Oktabr 2026'}],weekOptions:[{key:'w:2026-11-04',label:'Oxirgi 7 kun'}],dayOptions:[{key:'d:2026-11-04',label:'Bugun (04.11.2026)'},{key:'d:2026-11-03',label:'Kecha (03.11.2026)'}],defaults:{d:'d:2026-11-04',wa:'w:2026-11-04',a:'2026-11'},months:out}),200));
}
render();load(false);
})();
</script>
