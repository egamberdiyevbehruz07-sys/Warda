services:
  - type: web
    name: stockbook-telegram-miniapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BILLZ_TME_KEY
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        value: ""
